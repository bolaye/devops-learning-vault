---
# This playbook installs and configures Nginx on Ubuntu servers

- name: Configure Web Servers
  hosts: webservers
  become: yes  # This means "run as sudo/administrator"

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Start and enable Nginx service
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy custom index.html
      copy:
        content: "<h1>Managed by Ansible! 🤖</h1>"
        dest: /var/www/html/index.html