name: DevOps Capstone Pipeline

on:
  push:
    branches:
      - main
      - week12-capstone

jobs:
  # JOB 1: Validate Infrastructure as Code
  infrastructure-validation:
    runs-on: ubuntu-latest
    
    # Spin up LocalStack automatically in the background!
    services:
      localstack:
        image: localstack/localstack:2.3.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3,ec2,iam

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        working-directory: ./iac-labs/localstack-terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./iac-labs/localstack-terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./iac-labs/localstack-terraform
        run: terraform validate

      - name: Terraform Plan (LocalStack)
        working-directory: ./iac-labs/localstack-terraform
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: terraform plan

  # JOB 2: Validate Application Code
  application-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Python Syntax Check
        working-directory: ./monitoring-labs
        run: |
          echo "🤖 Running syntax check on health_monitor.py..."
          python -m py_compile health_monitor.py
          echo "✅ Python script is syntactically valid and ready for deployment!"